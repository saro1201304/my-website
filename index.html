<!DOCTYPE html>
<html>
<head>
  <title>Saro Expense - Budget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>💰 Saro Expense Tracker</h1>
  <h3 id="date"></h3>

  <input type="number" id="budget" placeholder="Set Today Budget ₹">
  <button onclick="setBudget()">Next ➡️</button>
</div>

<script>
function getToday() {
  let d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,'0') + "-" +
    String(d.getDate()).padStart(2,'0');
}

let today = getToday();
document.getElementById("date").innerText = "📅 " + today;

let data = JSON.parse(localStorage.getItem("expenses")) || {};

// if already exists → go directly
if (data[today]) {
  window.location.href = "expense.html";
}

function setBudget() {
  let b = Number(document.getElementById("budget").value);
  if (b <= 0) return alert("Enter valid budget");

  data[today] = { budget: b, total: 0, list: [] };
  localStorage.setItem("expenses", JSON.stringify(data));

  window.location.href = "expense.html";
}
</script>

</body>
</html>
